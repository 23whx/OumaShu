# 每週一檢查工具圖書館的所有網址；有網址失效時這個工作會失敗，GitHub 會寄信通知倉庫擁有者
name: Check library links

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-library.ts
